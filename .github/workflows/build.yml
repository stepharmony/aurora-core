---
name: Build Aether
on:
  schedule:
    - cron: "40 4 * * *"  # daily at 4:40 UTC
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "**.txt"
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "**.txt"
  merge_group:
  workflow_dispatch:

permissions: {}

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  push-ghcr:
    name: Build and Push
    runs-on: ubuntu-24.04
    continue-on-error: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image_name:
          - aether
          - aether-nvidia
        include:
          - fedora_version: 44
            kernel_flavor: ogc
            base_image_name: kinoite
            arch: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Fetch latest OGC kernel version
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
          LATEST_TAG=$(skopeo list-tags docker://ghcr.io/ublue-os/akmods \
            | jq -r '.Tags[]' \
            | grep "ogc-${{ matrix.fedora_version }}-.*x86_64" \
            | sort -V | tail -1)
          KERNEL_VER="${LATEST_TAG#ogc-${{ matrix.fedora_version }}-}"
          echo "Latest OGC kernel: ${KERNEL_VER}"
          echo "KERNEL_VERSION=${KERNEL_VER}" >> $GITHUB_ENV

      - name: Generate version tag
        id: version
        run: |
          IMAGE_NAME="${{ matrix.image_name }}"
          VERSION_TAG="$(date +%Y%m%d)"
          VERSION_PRETTY="$(date +%Y.%m.%d)"
          SHA_HEAD_SHORT="${GITHUB_SHA:0:7}"
          echo "VERSION_TAG=${VERSION_TAG}" >> $GITHUB_ENV
          echo "VERSION_PRETTY=${VERSION_PRETTY}" >> $GITHUB_ENV
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> $GITHUB_ENV
          echo "SHA_HEAD_SHORT=${SHA_HEAD_SHORT}" >> $GITHUB_ENV
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> $GITHUB_ENV

      - name: Build image
        id: build-image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eoux pipefail
          TARGET="${{ matrix.image_name }}"
          IMG="${IMAGE_REGISTRY}/${IMAGE_NAME}:${VERSION_TAG}"
          echo "${GITHUB_TOKEN}" > /tmp/gh_token
          buildah build \
            --target "${TARGET}" \
            --build-arg IMAGE_NAME="${IMAGE_NAME}" \
            --build-arg IMAGE_VENDOR="${GITHUB_REPOSITORY_OWNER}" \
            --build-arg FEDORA_VERSION="${{ matrix.fedora_version }}" \
            --build-arg KERNEL_FLAVOR="${{ matrix.kernel_flavor }}" \
            --build-arg KERNEL_VERSION="${KERNEL_VERSION}" \
            --build-arg BASE_IMAGE_NAME="${{ matrix.base_image_name }}" \
            --build-arg SHA_HEAD_SHORT="${SHA_HEAD_SHORT}" \
            --build-arg VERSION_TAG="${VERSION_TAG}" \
            --build-arg VERSION_PRETTY="${VERSION_PRETTY}" \
            --secret id=GITHUB_TOKEN,src=/tmp/gh_token \
            --tag "${IMG}" \
            -f Containerfile .
          rm -f /tmp/gh_token
          echo "image_tag=${IMG}" >> $GITHUB_OUTPUT

      - name: Container smoke test
        run: |
          set -eoux pipefail
          IMG="${IMAGE_REGISTRY}/${IMAGE_NAME}:${VERSION_TAG}"
          podman run --rm "${IMG}" sh -exc '
            echo "=== OS Release ==="
            head -5 /usr/lib/os-release
            echo ""
            echo "=== OGC kernel check ==="
            rpm -q kernel | grep -q ogc || (echo "ERROR: OGC kernel not installed" && exit 1)
            echo "OK: OGC kernel detected"
            echo ""
            echo "=== Key packages ==="
            rpm -q steam faugus-launcher mangohud gamescope protonplus plasma-oxygen oxygen-icon-theme
            echo ""
            echo "=== NVIDIA driver ==="
            rpm -q kmod-nvidia 2>/dev/null && echo "NVIDIA driver: OK" || echo "(not NVIDIA flavor — ok)"
            echo ""
            echo "=== Audio realtime configs ==="
            test -f /etc/security/limits.d/memlock.conf || (echo "ERROR: memlock.conf missing" && exit 1)
            test -f /etc/security/limits.d/95-realtime-audio.conf || (echo "ERROR: 95-realtime-audio.conf missing" && exit 1)
            echo "OK: audio realtime configs present"
            echo ""
            echo "=== libdrm compat symlink ==="
            test -L /usr/lib64/libdrm.so || (echo "ERROR: libdrm compat symlink missing" && exit 1)
            echo "OK: libdrm symlink present"
            echo ""
            echo "=== Clean slate — no Bazzite ujust recipes ==="
            test ! -f /usr/share/ublue-os/just/80-bazzite.just || (echo "ERROR: stale Bazzite recipes present" && exit 1)
            echo "OK: no Bazzite ujust recipes"
            echo ""
            echo "=== Image info ==="
            cat /usr/share/ublue-os/image-info.json || true
          '

      - name: Rechunk with rpm-ostree
        id: rechunk
        run: |
          IMG="${IMAGE_REGISTRY}/${IMAGE_NAME}:${VERSION_TAG}"
          podman run --rm --privileged \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/rpm-ostree:latest \
            rpm-ostree compose container-encapsulate \
            --repo=/ostree/repo \
            "ostree-unverified-registry:${IMG}" \
            "ostree-unverified-registry:${IMG}" || echo "Rechunk skipped (non-fatal)"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push to GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          IMG="${IMAGE_REGISTRY}/${IMAGE_NAME}"
          # tag as latest and testing
          podman tag "${IMG}:${VERSION_TAG}" "${IMG}:latest"
          podman tag "${IMG}:${VERSION_TAG}" "${IMG}:testing"
          # push all tags
          podman push "${IMG}:${VERSION_TAG}"
          podman push "${IMG}:latest"
          podman push --digestfile=/tmp/digestfile "${IMG}:testing"
          DIGEST=$(< /tmp/digestfile)
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

      - name: Sign container image
        id: sign-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          IMG="${IMAGE_REGISTRY}/${IMAGE_NAME}"
          cosign sign -y --key env://COSIGN_PRIVATE_KEY "${IMG}:latest" || echo "Signing skipped (no key)"
